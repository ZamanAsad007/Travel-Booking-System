global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'travel-microservices'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'auth-service:3001'
          - 'catalog-service:3002'
          - 'booking-service:3003'
          - 'payment-service:3004'
          - 'notification-service:3005'
